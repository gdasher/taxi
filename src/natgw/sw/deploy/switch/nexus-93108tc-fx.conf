! SPDX-License-Identifier: BSD-3-Clause
!
! natgw site switch: Cisco Nexus 93108TC-FX (NX-OS)
! 48 x 100M/1G/10GBASE-T (Eth1/1-48), 6 x 40/100G QSFP28 (Eth1/49-54)
!
! Port plan
!   Eth1/49/1-4   QSFP28 split 4x25G, one QSFP28 DAC to the U200's QSFP0
!     /1  U200 lane 0  LAN   VLAN 10   VPP CndmEthernet0
!     /2  U200 lane 1  WAN1  VLAN 101  VPP CndmEthernet1
!     /3  U200 lane 2  WAN2  VLAN 102  VPP CndmEthernet2
!     /4  U200 lane 3  shut
!   Eth1/50/1-4   QSFP28 split 4x25G to the U200's QSFP1: lanes 4-7, shut
!   Eth1/1        pve1 (R7515) LAN NIC, Proxmox bridge vmbr1   VLAN 10
!   Eth1/2        pve1 cluster NIC (corosync)                  VLAN 20
!   Eth1/3        pve1 iDRAC                                   VLAN 10
!   Eth1/4-7      further Proxmox nodes (LAN, cluster) pairs   VLAN 10 / 20
!   Eth1/8        spare, shut
!   Eth1/9-39     LAN clients, access points, other servers    VLAN 10
!   Eth1/40       this switch's mgmt0 (cable mgmt0 to Eth1/40)  VLAN 10
!   Eth1/41-44    spare, shut
!   Eth1/45       ISP 1 modem                                  VLAN 101
!   Eth1/46       ISP 2 modem                                  VLAN 102
!   Eth1/47-48    spare, shut
!   Eth1/51-54    spare, shut
!
! VLANs
!   10   LAN          192.168.1.0/24, gateway VPP 192.168.1.1
!   20   PVE-CLUSTER  10.20.0.0/24, Proxmox corosync only (no gateway)
!   101  WAN1         ISP 1's segment: the modem and U200 lane 1, nothing else
!   102  WAN2         ISP 2's segment: the modem and U200 lane 2, nothing else
! The switch has no address in any data VLAN (no SVIs, no "feature
! interface-vlan"); it is managed through mgmt0 in the management VRF.
!
! The U200's 25G links: Taxi's 25G PHY does no auto-negotiation and no FEC, so
! the switch ports are forced to 25G with FEC off. Use a short passive QSFP28
! DAC (1-2 m) rated to run 25G per lane without FEC (CA-N). Nexus may refuse
! non-Cisco cables. Check lane order once at bring-up: with only Eth1/49/2 up,
! VPP's CndmEthernet1 must be the interface with link.
!
! Replace the passwords, the NTP servers and the hostname before use.

hostname natgw-sw1

feature lldp

ip domain-lookup
ip name-server 192.168.1.2 use-vrf management

vrf context management
  ip route 0.0.0.0/0 192.168.1.1

interface mgmt0
  description management (cabled to Eth1/40, VLAN 10)
  vrf member management
  ip address 192.168.1.4/24

ntp server 162.159.200.1 use-vrf management
ntp server 162.159.200.123 use-vrf management

vlan 10
  name LAN
vlan 20
  name PVE-CLUSTER
vlan 101
  name WAN1-ISP1
vlan 102
  name WAN2-ISP2

spanning-tree mode rapid-pvst
! edge ports err-disable if they ever receive a BPDU
spanning-tree port type edge bpduguard default

! split the two QSFP28 ports cabled to the U200 into 4 x 25G
interface breakout module 1 port 49-50 map 25g-4x

! ---------------------------------------------------------------- U200

interface Ethernet1/49/1
  description natgw U200 QSFP0 lane 0 (LAN, CndmEthernet0)
  switchport
  switchport mode access
  switchport access vlan 10
  speed 25000
  no negotiation auto
  fec off
  spanning-tree port type edge
  no shutdown

interface Ethernet1/49/2
  description natgw U200 QSFP0 lane 1 (WAN1, CndmEthernet1)
  switchport
  switchport mode access
  switchport access vlan 101
  speed 25000
  no negotiation auto
  fec off
  spanning-tree port type edge
  no shutdown

interface Ethernet1/49/3
  description natgw U200 QSFP0 lane 2 (WAN2, CndmEthernet2)
  switchport
  switchport mode access
  switchport access vlan 102
  speed 25000
  no negotiation auto
  fec off
  spanning-tree port type edge
  no shutdown

interface Ethernet1/49/4
  description natgw U200 QSFP0 lane 3 (unused)
  speed 25000
  no negotiation auto
  fec off
  shutdown

interface Ethernet1/50/1-4
  description natgw U200 QSFP1 lanes 4-7 (unused)
  speed 25000
  no negotiation auto
  fec off
  shutdown

! ---------------------------------------------------------------- Proxmox

interface Ethernet1/1
  description pve1 LAN (vmbr1: gateway VM management, other VMs, host 192.168.1.3)
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

interface Ethernet1/2
  description pve1 cluster (corosync)
  switchport
  switchport mode access
  switchport access vlan 20
  spanning-tree port type edge
  no shutdown

interface Ethernet1/3
  description pve1 iDRAC
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

interface Ethernet1/4, Ethernet1/6
  description further Proxmox node LAN
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  shutdown

interface Ethernet1/5, Ethernet1/7
  description further Proxmox node cluster
  switchport
  switchport mode access
  switchport access vlan 20
  spanning-tree port type edge
  shutdown

! ---------------------------------------------------------------- LAN

interface Ethernet1/9-39
  description LAN
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  storm-control broadcast level 5.00
  storm-control multicast level 10.00
  no shutdown

interface Ethernet1/40
  description switch mgmt0
  switchport
  switchport mode access
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

! ---------------------------------------------------------------- WAN

! The ISP side: keep it quiet. No LLDP or CDP towards the ISP, and BPDUs
! filtered (an ISP device that bridges BPDUs must not shut the port down;
! each WAN VLAN has only these two ports, so there is no loop to protect).
! The copper ports do 100M/1G/10G only: a 2.5G or 5G modem port links at 1G.
interface Ethernet1/45
  description ISP 1 modem (WAN1)
  switchport
  switchport mode access
  switchport access vlan 101
  spanning-tree port type edge
  spanning-tree bpdufilter enable
  no lldp transmit
  no lldp receive
  no cdp enable
  no shutdown

interface Ethernet1/46
  description ISP 2 modem (WAN2)
  switchport
  switchport mode access
  switchport access vlan 102
  spanning-tree port type edge
  spanning-tree bpdufilter enable
  no lldp transmit
  no lldp receive
  no cdp enable
  no shutdown

! ---------------------------------------------------------------- spare

interface Ethernet1/8, Ethernet1/41-44, Ethernet1/47-48, Ethernet1/51-54
  description spare
  shutdown
